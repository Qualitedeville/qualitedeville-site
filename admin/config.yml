backend:
  name: git-gateway
  branch: main

# Dossier où seront enregistrées les images téléversées depuis le CMS
media_folder: "site/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Contenu des pages"
    files:
      - file: "site/data/accueil.json"
        label: "Page d'accueil"
        name: "accueil"
        fields:
          - { label: "Titre principal", name: "titre", widget: "string" }
          - { label: "Sous-titre / Texte", name: "description", widget: "text" }

      - file: "site/data/presentation.json"
        label: "Page Présentation"
        name: "presentation"
        fields:
          - { label: "Titre de présentation", name: "titre", widget: "string" }
          - { label: "Contenu", name: "contenu", widget: "markdown" }

      - file: "site/data/actions.json"
        label: "Page Actions"
        name: "actions"
        fields:
          - { label: "Titre de la section", name: "titre", widget: "string" }
          - { label: "Description des actions", name: "description", widget: "text" }
